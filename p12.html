<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio projects grid with advanced CSS Grid
    </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .grid-item {
            background-color: #f9f9f9;
            border: 1px solid #ccc;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>Portfolio Projects Grid with Advanced CSS Grid</h1>
    <div class="grid-container">
        <div class="grid-item">
            <h2>Project 1</h2>
            <p>Description of Project 1.</p>
        </div>
        <div class="grid-item">
            <h2>Project 2</h2>
            <p>Description of Project 2.</p>
        </div>
        <div class="grid-item">
            <h2>Project 3</h2>
            <p>Description of Project 3.</p>
        </div>
        <div class="grid-item">
            <h2>Project 4</h2>
            <p>Description of Project 4.</p>
        </div>
        <div class="grid-item">
            <h2>Project 5</h2>
            <p>Description of Project 5.</p>
        </div>
        <div class="grid-item">
            <h2>Project 6</h2>
            <p>Description of Project 6.</p>
        </div>
    </div>
</body>
</html>
